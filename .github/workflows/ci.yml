name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: new advisories appear even when the code has not changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOC_GEN_GO: v1.36.12
  PROTOC_GEN_GO_GRPC: v1.6.2

jobs:
  backend:
    runs-on: ubuntu-24.04
    # a real database: the tenant-isolation tests skip without one, and a skipped isolation test protects nothing
    services:
      db:
        image: timescale/timescaledb:2.32.1-pg17
        env:
          POSTGRES_USER: aero
          POSTGRES_PASSWORD: aero
          POSTGRES_DB: aero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aero -d aero_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AERO_TEST_DATABASE_URL: postgres://aero:aero@localhost:5432/aero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Protobuf tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"${PROTOC_GEN_GO}"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"${PROTOC_GEN_GO_GRPC}"
      - name: Generate, vet, test
        working-directory: backend
        run: |
          make proto
          go vet ./...
          go test -race -count=1 ./...
          # the isolation suites must actually run, not skip
          go test -count=1 -v -run 'TestTenantIsolation|TestIncidentsStayInTheirHostsOrganization' ./internal/api ./internal/orchestrator | tee /tmp/iso.txt
          ! grep -q -- '--- SKIP' /tmp/iso.txt
      - name: Known vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  remediation-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: remediation-agent/go.mod
          cache-dependency-path: remediation-agent/go.sum
      - name: Protobuf tools (the agent imports the backend's generated code)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"${PROTOC_GEN_GO}"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"${PROTOC_GEN_GO_GRPC}"
          make -C backend proto
      - name: Vet and test
        working-directory: remediation-agent
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Known vulnerabilities
        working-directory: remediation-agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Known vulnerabilities (fails on high or critical)
        run: npm audit --audit-level=high

  monitoring-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Ubuntu 24.04 gRPC 1.51 with GCC 14, the combination the agent is developed on)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake pkg-config libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
      - name: Build and test
        run: |
          cmake -S agent -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=ci-only docker compose -f deploy/docker/docker-compose.yml config -q
      - name: Build the backend image
        run: docker build -f deploy/docker/Dockerfile -t aero-backend:ci .
      - name: Scan our image (fails on a fixable high or critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aero-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the upstream images we run (reported but not blocking, since we cannot patch them)
        run: |
          grep -hoE 'image: (timescale|apache|busybox)[^ ]+' deploy/docker/docker-compose.yml | cut -d' ' -f2 | sort -u | while read -r img; do
            echo "::group::$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed "$img" || true
            echo "::endgroup::"
          done

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Security misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/terraform
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Look for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          exit-code: "1"
